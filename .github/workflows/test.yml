name: Test dotfiles

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n bootstrap.sh setup.sh link.sh setup/*
      - name: Run tests
        run: tests/run.sh
